<!-- ================================================================= -->
<!-- BONETECH MEDISYS AI CLINICAL CHATBOT (n8n Integration)            -->
<!-- Responsive: Desktop, Tablet, and Mobile                           -->
<!-- ================================================================= -->

<!-- 1. Google Font (Plus Jakarta Sans - Matches Medical Precision Aesthetic) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

<!-- 2. Base n8n Chat Stylesheet -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

<!-- 3. Bonetech Custom Medical Theme Stylesheet -->
<style>
  :root {
    /* Brand Clinical Colors */
    --bt-blue: #0066FF;
    --bt-blue-hover: #0052CC;
    --bt-dark-navy: #070D19;
    --bt-slate: #0F172A;
    --bt-surface: #F4F7FC;
    --bt-border: #E2E8F0;
    --bt-online-green: #10B981;

    /* n8n Chat Component Overrides */
    --chat--font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --chat--color--primary: var(--bt-blue);
    --chat--color--primary-shade-50: var(--bt-blue-hover);
    --chat--color--secondary: var(--bt-blue);
    --chat--color-dark: var(--bt-dark-navy);
    --chat--color-light: var(--bt-surface);
    --chat--border-radius: 18px;
    --chat--transition-duration: 0.25s;

    /* Desktop Window Geometry */
    --chat--window--width: 410px;
    --chat--window--height: 640px;
    --chat--window--bottom: 48px;
    --chat--window--right: 24px;
    --chat--window--z-index: 999999;
    --chat--window--border: 1px solid rgba(0, 102, 255, 0.15);
    --chat--window--border-radius: 24px;

    /* Header */
    --chat--header--padding: 18px 20px;
    --chat--header--background: linear-gradient(135deg, #070D19 0%, #0E1B36 55%, #004ECC 100%);
    --chat--header--color: #f5ebeb;
    --chat--heading--font-size: 1.1rem;

    /* Message Bubbles */
    --chat--message--font-size: 0.92rem;
    --chat--message--padding: 13px 17px;
    --chat--message--border-radius: 18px;
    --chat--message-line-height: 1.55;
    --chat--message--bot--background: #FFFFFF;
    --chat--message--bot--color: var(--bt-slate);
    --chat--message--bot--border: 1px solid var(--bt-border);
    --chat--message--user--background: linear-gradient(135deg, #0066FF 0%, #004ECC 100%);
    --chat--message--user--color: #FFFFFF;
    --chat--message--user--border: none;

    /* Floating Launcher Button */
    --chat--toggle--size: 62px;
    --chat--toggle--background: #070D19;
    --chat--toggle--hover--background: #0F172A;
    --chat--toggle--color: #ffffff;

    /* Input & Footer */
    --chat--input--background: #ffffff;
    --chat--input--padding: 10px 14px;
    --chat--body--background: var(--bt-surface);
    --chat--footer--background: #ffffff;
    --chat--footer--border-top: 1px solid #E8EEF5;
  }

  /* --- Launcher Button Pulse & Glow --- */
  .chat-window-wrapper .chat-window-toggle {

    background: #070D19 !important;

    box-shadow: 0 10px 25px -4px rgba(0, 102, 255, 0.45) !important;

    position: relative !important;

    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease !important;

    animation: bonetechPulse 3s infinite !important;

  }

  .chat-window-wrapper .chat-window-toggle:hover {

    background: #0F172A !important;

    transform: scale(1.08) !important;

    box-shadow: 0 14px 30px -4px rgba(0, 102, 255, 0.6) !important;

  }

  @keyframes bonetechPulse {
    0% {
      box-shadow: 0 10px 25px -4px rgba(0, 102, 255, 0.45), 0 0 0 0 rgba(0, 102, 255, 0.4);
    }

    70% {
      box-shadow: 0 10px 25px -4px rgba(0, 102, 255, 0.45), 0 0 0 14px rgba(0, 102, 255, 0);
    }

    100% {
      box-shadow: 0 10px 25px -4px rgba(0, 102, 255, 0.45), 0 0 0 0 rgba(0, 102, 255, 0);
    }
  }

  /* --- Unread Notification Badge --- */
  .bonetech-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    background: #10B981;
    color: #ffffff;
    border: 2.5px solid #ffffff;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
  }

  /* --- Floating Teaser Pill --- */
  .bonetech-teaser-pill {
    position: absolute;
    bottom: 22px;
    right: 76px;
    background: #FFFFFF;
    border: 1px solid rgba(0, 102, 255, 0.18);
    border-radius: 30px;
    padding: 8px 14px 8px 10px;
    box-shadow: 0 12px 28px -6px rgba(11, 19, 43, 0.16), 0 0 0 1px rgba(0, 102, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    cursor: pointer;
    z-index: 999998;
    transition: all 0.25s ease;
    animation: teaserSlide 0.4s ease;
  }

  .bonetech-teaser-pill:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px -6px rgba(0, 102, 255, 0.22);
  }

  .bonetech-teaser-pill .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #0066FF;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
  }

  .bonetech-teaser-pill .title {
    font-size: 0.82rem;
    font-weight: 700;
    color: #0F172A;
    line-height: 1.2;
  }

  .bonetech-teaser-pill .subtitle {
    font-size: 0.72rem;
    color: #0066FF;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .bonetech-teaser-pill .subtitle::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #10B981;
    border-radius: 50%;
    display: inline-block;
  }

  .bonetech-teaser-pill .close-btn {
    background: transparent;
    border: none;
    color: #94A3B8;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }

  @keyframes teaserSlide {
    from {
      opacity: 0;
      transform: translateX(15px);
    }

    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* --- Chat Window Container --- */
  .chat-window-wrapper .chat-window {
    box-shadow: 0 28px 65px -12px rgba(7, 13, 25, 0.28), 0 0 0 1px rgba(0, 102, 255, 0.14) !important;
    border: 1px solid rgba(0, 102, 255, 0.16) !important;
    border-radius: 24px !important;
    background: #ffffff !important;
    overflow: hidden !important;
  }

  /* --- Header Custom Clinical Layout --- */
  .chat-layout .chat-header {
    background: linear-gradient(135deg, #070D19 0%, #0E1B36 55%, #004ECC 100%) !important;
    padding: 18px 20px !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
  }

  .bonetech-header-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .bonetech-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bonetech-avatar-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .bonetech-avatar-wrap .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #0066FF;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.85);
  }

  .bonetech-avatar-wrap .avatar-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .bonetech-avatar-wrap .dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    background: #10B981;
    border: 2px solid #070D19;
    border-radius: 50%;
  }

  .bonetech-header-titles h1 {
    font-size: 1.05rem !important;
    font-weight: 700 !important;
    color: #ffffff !important;
    margin: 0 !important;
    line-height: 1.2 !important;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bonetech-header-titles .verified-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    background: #00E5FF;
    color: #070D19;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 900;
  }

  .bonetech-header-titles p {
    font-size: 0.76rem !important;
    color: rgba(255, 255, 255, 0.8) !important;
    margin: 3px 0 0 0 !important;
  }

  .bonetech-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0, 229, 255, 0.15);
    border: 1px solid rgba(0, 229, 255, 0.35);
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 0.68rem;
    color: #00E5FF;
    font-weight: 600;
    margin-top: 4px;
  }

  .chat-layout .chat-header .chat-close-button {
    background: rgba(255, 255, 255, 0.14) !important;
    color: #ffffff !important;
    border-radius: 50% !important;
    width: 32px !important;
    height: 32px !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
  }

  .chat-layout .chat-header .chat-close-button:hover {
    background: rgba(255, 255, 255, 0.3) !important;
  }

  /* --- Messages Styling --- */
  .chat-body {
    background: #F4F7FC !important;
  }

  .chat-message-from-bot {
    background: #FFFFFF !important;
    border: 1px solid #E2E8F0 !important;
    border-radius: 18px 18px 18px 4px !important;
    box-shadow: 0 4px 14px -2px rgba(11, 19, 43, 0.05) !important;
    max-width: 88% !important;
  }

  .chat-message-from-user {
    background: linear-gradient(135deg, #0066FF 0%, #004ECC 100%) !important;
    color: #FFFFFF !important;
    border-radius: 18px 18px 4px 18px !important;
    max-width: 85% !important;
    box-shadow: 0 4px 14px rgba(0, 102, 255, 0.25) !important;
  }

  /* --- Modern Input Box & Send Button --- */
  .chat-inputs {
    background: #F8FAFD !important;
    border: 1px solid #E2E8F0 !important;
    border-radius: 10px !important;
    padding: 6px 8px 6px 14px !important;
    transition: all 0.2s ease !important;
  }

  .chat-inputs:focus-within {
    border-color: #ffffff !important;
    background: #FFFFFF !important;
    box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12) !important;
  }

  .chat-input-send-button {
    background: #0066FF !important;
    color: #FFFFFF !important;
    border-radius: 50% !important;
    width: 36px !important;
    height: 36px !important;
    border: none !important;
    cursor: pointer !important;
    transition: transform 0.2s ease !important;
    box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3) !important;
  }

  .chat-input-send-button:hover:not(:disabled) {
    background: #0052CC !important;
    transform: scale(1.05) !important;
  }

  /* ================================================================= */
  /* RESPONSIVE SPECIFICATIONS: TABLET & MOBILE VIEWPORTS              */
  /* ================================================================= */

  /* TABLET (641px - 1024px) */
  @media (max-width: 1024px) and (min-width: 641px) {
    :root {
      --chat--window--width: 390px;
      --chat--window--height: 590px;
      --chat--window--bottom: 20px;
      --chat--window--right: 20px;
    }
  }

  /* MOBILE (<= 640px) */
  @media (max-width: 640px) {
    :root {
      --chat--window--bottom: 0px !important;
      --chat--window--right: 0px !important;
      --chat--window--width: 100vw !important;
      --chat--window--height: 100dvh !important;
      --chat--window--border-radius: 0px !important;
      --chat--toggle--size: 58px;
    }

    .chat-window-wrapper {
      bottom: 32px !important;
      right: 16px !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }

    /* Full-screen native app drawer on mobile */
    .chat-window-wrapper .chat-window {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
      z-index: 9999999 !important;
    }

    .bonetech-teaser-pill {
      display: none !important;
    }

    .chat-layout .chat-header {
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px 16px !important;
    }

    .chat-footer {
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
    }
  }
</style>

<!-- 4. Chatbot Companion Script (Initializes Chat & Clinical Enhancements) -->
<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  // Initialize n8n Chat with Bonetech Medisys Configuration
  createChat({
    webhookUrl: 'https://sampatel26.app.n8n.cloud/webhook/05a63753-4b8b-46be-a86f-77eee24cb1b0/chat',
    target: '#n8n-chat',
    mode: 'window',
    loadPreviousSession: true,
    showWelcomeScreen: false,
    defaultLanguage: 'en',
    initialMessages: [
      "Hi there! 👋"
    ],
    i18n: {
      en: {
        title: "Sweta Gupta",
        subtitle: "Advancing Movement, Advancing Life",
        inputPlaceholder: "Type your message here...",
        footer: "Bonetech Medisys • Precision Orthopedic Systems",
        getStarted: "New Conversation",
        closeButtonTooltip: "Close Chat"
      }
    }
  });

  // Attach Clinical UX Enhancements (Teaser Pill, Notification Badge, Quick Chips)
  const timer = setInterval(() => {
    const toggleBtn = document.querySelector('.chat-window-toggle');
    const wrapper = document.querySelector('.chat-window-wrapper');

    if (toggleBtn && wrapper) {
      clearInterval(timer);

      // Notification badge on launcher
      if (!toggleBtn.querySelector('.bonetech-badge')) {
        const badge = document.createElement('div');
        badge.className = 'bonetech-badge';
        badge.textContent = '1';
        toggleBtn.appendChild(badge);
      }

      // Proactive Teaser Pill
      if (!document.querySelector('.bonetech-teaser-pill')) {
        const teaser = document.createElement('div');
        teaser.className = 'bonetech-teaser-pill';
        teaser.innerHTML = `
        <div class="avatar">
  <img src="https://play-lh.googleusercontent.com/rMuh7lvgcuKfgb6ZnjtXhwlolXvRXm_5EA8BPbqRd8_33c-QahdBYk9pykUD6oBm390rlsuF86TxPf09jJqkAA=w240-h480-rw" alt="Sweta Gupta">
</div>
            <div class="title">Need Orthopedic Help?</div>
            <div class="subtitle">💬 Chat with Specialist</div>
          </div>
          <button class="close-btn" title="Dismiss">&times;</button>
        `;
        teaser.addEventListener('click', (e) => {
          if (e.target.closest('.close-btn')) {
            e.stopPropagation();
            teaser.style.display = 'none';
            return;
          }
          toggleBtn.click();
          teaser.style.display = 'none';
        });
        wrapper.appendChild(teaser);
      }

      // Observer to inject Header when opened
      const observer = new MutationObserver(() => {
        const chatWindow = wrapper.querySelector('.chat-window');
        const teaser = document.querySelector('.bonetech-teaser-pill');
        const badge = document.querySelector('.bonetech-badge');

        if (chatWindow && chatWindow.style.display !== 'none' && !chatWindow.classList.contains('chat-window-transition-leave-active')) {
          if (teaser) teaser.style.display = 'none';
          if (badge) badge.style.display = 'none';

          // Enhance Header with Sweta Gupta & Avatar
          const header = chatWindow.querySelector('.chat-header');
          if (header && !header.dataset.enhanced) {
            header.dataset.enhanced = 'true';
            const headingDiv = header.querySelector('.chat-heading');
            const closeBtn = headingDiv?.querySelector('.chat-close-button');
            const subP = header.querySelector('p');
            if (subP) subP.style.display = 'none';

            if (headingDiv) {
              const brand = document.createElement('div');
              brand.className = 'bonetech-header-brand';
              brand.innerHTML = `
                <div class="bonetech-header-left"> 
                  <div class="bonetech-avatar-wrap"> 
                    <div class="avatar-img">
                      <img src="https://img.magnific.com/premium-photo/beautiful-happy-smiling-asian-young-girl-from-nepal-giving-several-gestures-formal-dress_723123-1927.jpg?semt=ais_hybrid&w=740&q=80" alt="Sweta Gupta" onerror="this.onerror=null; this.src='https://www.bonetechmedisys.com/favicon.ico';">
                    </div>
                    <span class="dot"></span>
                  </div>
                  <div class="bonetech-header-titles">
                    <h1>Sweta Gupta <span class="verified-badge" title="Verified Bonetech Specialist">✓</span></h1>
                    <p>Advancing Movement, Advancing Life</p>
                    <span class="bonetech-status-pill">● Online • Ready to Assist</span>
                  </div>
                </div>
              `;
              headingDiv.innerHTML = '';
              headingDiv.appendChild(brand);
              if (closeBtn) brand.appendChild(closeBtn);
            }
          }
        }
      });

      observer.observe(wrapper, { childList: true, subtree: true, attributes: true });
    }
  }, 100);
</script>
